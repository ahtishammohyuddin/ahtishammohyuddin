<text x="30" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e" letter-spacing="1">ISSUE</text><text x="30" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e6edf3">Nobody gets good at IT support by reading about it, and</text><text x="30" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e6edf3">practising on real users is risky.</text><text x="30" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#3fb950" letter-spacing="1">RESOLUTION</text><text x="30" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e6edf3">A 3D office game with 146 reviewed tickets. The AI</text><text x="30" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e6edf3">coaches but never decides what is correct, and the game</text><text x="30" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e6edf3">works with AI switched off. 370+ tests.</text>
